<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다시, 나 - 경력 포트폴리오</title>
    <!-- Google Fonts: Noto Sans KR 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 외부 CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">

<body>

    <!-- 상단 헤더 영역 -->
    <header>
        <h1>다시, 나</h1>
        <p>10년 경력의 사무행정 전문가, 다시 시작합니다</p>
    </header>

    <!-- 네비게이션 메뉴 영역 -->
    <nav>
        <ul>
            <li><a href="#about">소개</a></li>
            <li><a href="#career">경력</a></li>
            <li><a href="#skills">역량</a></li>
            <li><a href="#education">교육·자격</a></li>
            <li><a href="#contact">문의</a></li>
        </ul>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <!-- 소개 섹션 -->
        <section id="about">
            <h2>소개</h2>
            <p>안녕하세요! 이름: 김지은 / 한 줄 소개: 10년 경력의 사무행정 전문가, 다시 시작합니다</p>
            <!-- 플레이스홀더 이미지 삽입 -->
            <img src="https://placehold.co/300x300?text=Profile" width="300" height="300" alt="프로필 이미지">
        </section>

        <!-- 경력 섹션 -->
        <section id="career">
            <h2>경력</h2>
            <p>상세 경력 내용이 들어갈 자리입니다.</p>
        </section>

        <!-- 역량 섹션 -->
        <section id="skills">
            <h2>역량</h2>
            <p>보유 역량 및 기술이 들어갈 자리입니다.</p>
        </section>

        <!-- 교육·자격 섹션 -->
        <section id="education">
            <h2>교육·자격</h2>
            <p>이수 교육 및 자격증 정보가 들어갈 자리입니다.</p>
        </section>

        <!-- 문의 섹션 -->
        <section id="contact">
            <h2>문의</h2>
            <p>연락처 및 문의 양식이 들어갈 자리입니다.</p>
        </section>
    </main>

    <!-- 하단 푸터 영역 -->
    <footer>
        <p>&copy; 2026 Kim Ji Eun. All rights reserved.</p>
    </footer>

    <!-- 외부 JavaScript 연결 -->
    <script src="js/script.js"></script>
